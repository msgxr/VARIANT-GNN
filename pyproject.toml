[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "variant-gnn"
version = "0.1.0"
description = "Graph Neural Network tabanlı genetik varyant patojenite tahmini — TEKNOFEST 2026"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.9"

dependencies = [
    "pandas==2.3.3",
    "numpy==2.0.2",
    "scikit-learn==1.6.1",
    "scipy==1.13.1",
    "joblib==1.5.3",
    "xgboost==2.1.4",
    "lightgbm==4.6.0",
    "imbalanced-learn==0.12.4",
    "torch==2.8.0",
    "torch-geometric==2.6.1",
    "shap==0.49.1",
    "lime==0.2.0.1",
    "matplotlib==3.9.4",
    "seaborn==0.13.2",
    "networkx==3.2.1",
    "tqdm==4.67.3",
    "optuna==4.7.0",
    "streamlit==1.50.0",
    "pydantic==2.12.5",
    "pyyaml==6.0.3",
    "fpdf2==2.8.4",
]

[project.optional-dependencies]
dev = [
    "pytest==8.4.2",
    "pytest-timeout==2.3.1",
    "flake8==7.0.0",
    "black==24.3.0",
    "mypy==1.9.0",
    "pre-commit==3.7.0",
]

[project.scripts]
variant-gnn = "main:main"

[tool.black]
line-length = 120
target-version = ["py310"]

[tool.mypy]
python_version = "3.9"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
timeout = 120

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = [
    "E501",   # line too long
    "E741",   # ambiguous variable name
    "W291",   # trailing whitespace
    "W293",   # whitespace before ':'
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["F401", "F811", "E402"]
"tests/**/*.py" = ["F401", "F811", "E402"]
"conftest.py" = ["F401"]
"src/*/__init__.py" = ["F401"]
"data_contracts/__init__.py" = ["F401"]
