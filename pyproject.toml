[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "variant-gnn"
version = "0.1.0"
description = "Graph Neural Network tabanlı genetik varyant patojenite tahmini — TEKNOFEST 2026"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10,<3.13"

dependencies = [
    "pandas==2.2.2",
    "numpy==1.26.4",
    "scikit-learn==1.4.2",
    "scipy==1.13.0",
    "joblib==1.4.2",
    "xgboost==2.0.3",
    "lightgbm==4.3.0",
    "imbalanced-learn==0.12.3",
    "torch==2.2.1",
    "torch-geometric==2.5.3",
    "shap==0.45.1",
    "lime==0.2.0.1",
    "matplotlib==3.8.4",
    "seaborn==0.13.2",
    "networkx==3.3",
    "tqdm==4.66.4",
    "optuna==3.6.1",
    "streamlit==1.58.0",
    "pydantic==2.7.1",
    "pyyaml==6.0.1",
    "fpdf2==2.7.9",
]

[project.optional-dependencies]
dev = [
    "pytest==8.2.0",
    "pytest-timeout==2.3.1",
    "flake8==7.0.0",
    "black==24.3.0",
    "mypy==1.10.0",
    "pre-commit==3.7.1",
]

# Konsol komutu: `variant-gnn`. Giris noktasi, editable kurulumda (pip install -e .
# / pipx install -e .) repoya CANLI bagli olan src paketinin icindedir
# (src/cli/entry.py). Boylece kaynak duzenlemeleri aninda yansir; kok duzeyindeki
# main.py'yi site-packages'a kopyalayip global ad alanini kirletmekten kacinir.
[project.scripts]
variant-gnn = "src.cli.entry:main"

# Paketleme: depo "src/" + "data_contracts/" duzeninde. Hatchling'in proje adiyla
# (variant_gnn) eslesen bir klasor bulamamasi build'i metadata asamasinda
# kiriyordu; asagidaki secim bunu cozer ve `pip install -e .` / `pipx install -e .`
# komutlarini calisir hale getirir.
[tool.hatch.build.targets.wheel]
packages = ["src", "data_contracts"]

[tool.black]
line-length = 120
target-version = ["py310"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
timeout = 120

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = [
    "E501",   # line too long
    "E741",   # ambiguous variable name
    "W291",   # trailing whitespace
    "W293",   # whitespace before ':'
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["F401", "F811", "E402"]
"tests/**/*.py" = ["F401", "F811", "E402"]
"conftest.py" = ["F401"]
"src/*/__init__.py" = ["F401"]
"data_contracts/__init__.py" = ["F401"]
