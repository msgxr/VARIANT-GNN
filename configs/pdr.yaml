# configs/pdr.yaml — TEKNOFEST 2026 PDR (Proje Detay Raporu) Konfigürasyonu
#
# psr.yaml tüm temel parametreleri tanımlar; bu dosya PDR'a özgü override'ları içerir.
# Kullanım: python main.py --mode train --config configs/pdr.yaml

seed: 42
device: auto

paths:
  data_dir: data
  models_dir: models
  reports_dir: reports

competition:
  mode: true          # Yarışma modu: leakage firewall aktif, strict schema kontrolü
  strict_leakage: false  # False: koordinat kolonları drop+uyar; True: drop+hata

# PDR §5.3: Gerçek TEKNOFEST verisiyle optimize edilmiş GNN parametreleri
gnn:
  hidden_dim: 128
  epochs: 80                   # PSR=50 → PDR=80 (erken durdurma ile etkin)
  lr: 0.001
  weight_decay: 1.0e-4
  use_gat: true
  knn_k: 10
  early_stopping_patience: 20
  use_multimodal: false
  seq_enc_dim: 32

dnn:
  hidden_dim: 128
  epochs: 30
  use_dann: true   # Domain-Adversarial (panel-invariant) — LOPO +2.17pp
  lr: 0.001
  weight_decay: 1.0e-4

xgb:
  objective: binary:logistic
  eval_metric: logloss
  max_depth: 6
  learning_rate: 0.05
  subsample: 0.8
  colsample_bytree: 0.8
  n_estimators: 200
  n_jobs: -1
  min_child_weight: 3
  reg_alpha: 0.05
  reg_lambda: 1.0

lgbm:
  objective: binary
  num_leaves: 63
  max_depth: -1
  learning_rate: 0.05
  n_estimators: 300
  subsample: 0.8
  colsample_bytree: 0.8
  reg_alpha: 0.1
  reg_lambda: 1.0
  min_child_samples: 10
  n_jobs: -1
  verbose: -1

# §7.3: Birincil metrik binary F1 (TP/FP/FN, pos_label=1 Patojenik)
ensemble:
  weights: [0.30, 0.30, 0.25, 0.15]   # XGBoost / LightGBM / GNN / DNN
  optimize_weights: true               # Nelder-Mead ile OOF üzerinden optimizasyon
  panel_aware: true                    # Panel bazlı ağırlık optimizasyonu (test seti dokunulmaz)

preprocessing:
  corr_threshold: 0.25
  # AutoEncoder + aggressive SelectKBest(35) DISCARD signal: under leakage-free
  # group-aware CV they cost ~5.3pp F1 (0.8135 with k=35+AE vs 0.8668 with all
  # 343 features). The §3.2 profile is information-dense → keep all features.
  # Evidence: reports/preprocessing_diagnostic.json
  use_autoencoder: false
  autoencoder_encoding_dim: 16
  autoencoder_epochs: 10
  use_feature_selection: false
  k_best_features: 150
  smote_enabled: true
  use_bio_scoring: false      # §3.2: eski yol — AA_Context/Ref_AA bekler, gerçek veride yok
  use_acmg_proxy: false       # §3.2: adlandırılmış CADD/REVEL/SIFT bekler, anonim veride yok
  use_categorical_bio: true   # AA_1→AA_2 Grantham/BLOSUM + popülasyon/bölge/in-silico kurtarma (doğrulandı +0.38pp/+0.023 MCC)

calibration:
  enabled: true
  method: isotonic

training:
  test_size: 0.20
  cv_folds: 5
  batch_size: 32
  loss_function: weighted_bce
  focal_gamma: 2.0

thresholds:
  # Kanonik karar eşiği θ=0.8415 (models/threshold.json önceliklidir; bu yalnız fallback).
  # %20-patojenik resmi prior'da F1-optimal, HAM olasılıkta türetildi.
  classification: 0.8415
  high_risk: 0.70

schema:
  target_column: Label
  id_columns:
    - Variant_ID
  non_feature_columns:
    - Panel
    - Nuc_Context
    - AA_Context
  label_mapping:
    pathogenic: 1
    "likely pathogenic": 1
    benign: 0
    "likely benign": 0
    "1": 1
    "1.0": 1
    "0": 0
    "0.0": 0

# §3.2: Panel sayıları şartname ile birebir uyumlu
panels:
  General:
    train_pathogenic: 1500
    train_benign: 1500
    test_pathogenic: 1000
    test_benign: 1000
  Hereditary_Cancer:
    train_pathogenic: 200
    train_benign: 200
    test_pathogenic: 100
    test_benign: 100
  PAH:
    train_pathogenic: 200
    train_benign: 200
    test_pathogenic: 100
    test_benign: 100
  CFTR:
    train_pathogenic: 70
    train_benign: 70
    test_pathogenic: 30
    test_benign: 30

triage:
  enabled: true
  uncertainty_threshold: 0.30   # MC Dropout σ > 0.30 → uzman incelemesi önerilir
  borderline_margin: 0.10
  entropy_threshold: 0.65

reproducibility:
  seed: 42
  deterministic_torch: true
  save_manifest: true

external_validation:
  enabled: true
  metrics:
    - f1
    - roc_auc
    - brier_score
    - precision
    - recall
  export_predictions: true
