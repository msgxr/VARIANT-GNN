# ════════════════════════════════════════════════════════════════════════
# INFORMATIONAL ONLY — not loaded by the pipeline.
# Live threshold = models/threshold.json (θ=0.8415).
# Panel opt-in flag = cfg.inference.use_panel_thresholds (default false).
# ════════════════════════════════════════════════════════════════════════
# configs/thresholds.yaml — Karar eşiği ve risk sınıflandırma ayarları

decision_threshold:
  default: 0.8415   # CANONICAL global θ (models/threshold.json; %20-patojenik calibration-set F1-optimal)
  optimize: true
  optimize_metric: binary_f1
  search_range: [0.01, 0.99]
  search_steps: 100

risk_categories:
  high_risk:
    min_probability: 0.7
    label: "Yüksek Risk"
    action: "Uzman değerlendirmesi önerilir"
  medium_risk:
    min_probability: 0.4
    max_probability: 0.7
    label: "Orta Risk"
    action: "Ek klinik bağlam ile değerlendirin"
  low_risk:
    max_probability: 0.4
    label: "Düşük Risk"
    action: "Rutin takip"

confidence_thresholds:
  high_confidence: 0.85
  medium_confidence: 0.65
  low_confidence: 0.0

uncertainty_thresholds:
  high_uncertainty: 0.35
  medium_uncertainty: 0.20

panel_specific_thresholds:
  # OPT-IN (varsayılan KAPALI — use_panel_thresholds=false); jüri global θ=0.8415 kullanır.
  # Değerler shipped models/panel_thresholds.json / reports/cv_report.json ile birebir.
  MASTER:
    decision_threshold: 0.3990
    notes: "Genel panel; opt-in (jüri kullanmaz). reports/cv_report.json panel_thresholds.General"
  Hereditary_Cancer:
    decision_threshold: 0.4532
    notes: "Yüksek klinik öneme sahip panel; opt-in (jüri kullanmaz)"
  PAH:
    decision_threshold: 0.4434
    notes: "Küçük panel; opt-in (jüri kullanmaz)"
  CFTR:
    decision_threshold: 0.1922
    notes: "En küçük panel (n=18 test); opt-in (jüri kullanmaz)"
