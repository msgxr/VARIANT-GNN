# configs/thresholds.yaml — Karar eşiği ve risk sınıflandırma ayarları

decision_threshold:
  default: 0.241
  optimize: true
  optimize_metric: binary_f1
  search_range: [0.1, 0.5]
  search_steps: 60

risk_categories:
  high_risk:
    min_probability: 0.7
    label: "Yüksek Risk"
    action: "Uzman değerlendirmesi önerilir"
  medium_risk:
    min_probability: 0.4
    max_probability: 0.7
    label: "Orta Risk"
    action: "Ek klinik bağlam ile değerlendirin"
  low_risk:
    max_probability: 0.4
    label: "Düşük Risk"
    action: "Rutin takip"

confidence_thresholds:
  high_confidence: 0.85
  medium_confidence: 0.65
  low_confidence: 0.0

uncertainty_thresholds:
  high_uncertainty: 0.35
  medium_uncertainty: 0.20

panel_specific_thresholds:
  MASTER:
    decision_threshold: 0.241
    notes: "Genel panel; optimize edilmiş binary F1 eşiği"
  Hereditary_Cancer:
    decision_threshold: 0.281
    notes: "Yüksek klinik öneme sahip panel; optimize eşik"
  PAH:
    decision_threshold: 0.138
    notes: "Küçük panel; yüksek recall öncelikli"
  CFTR:
    decision_threshold: 0.108
    notes: "En küçük panel (30 test örneği); maksimum hassasiyet"
