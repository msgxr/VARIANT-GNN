# configs/evaluation.yaml — Değerlendirme modu yapılandırması

mode: eval

evaluation:
  primary_metric: binary_f1
  metrics:
    - binary_f1
    - roc_auc
    - pr_auc
    - mcc
    - brier_score
    - ece
    - precision
    - recall
    - specificity
  report_per_panel: true
  threshold_search: true
  # Shipped karar eşiği θ=0.8415 models/threshold.json'da yaşar; bu aralık YALNIZCA
  # teşhis amaçlı tarama içindir (önceki [0.1, 0.5] canonical θ=0.8415'i dışlıyordu).
  threshold_search_range: [0.05, 0.95]
  threshold_search_steps: 40

calibration_eval:
  n_bins: 10
  strategy: uniform

external_validation:
  compute_adversarial: false
  save_report: true
  report_file: reports/external_validation_report.json

adversarial_validation:
  n_estimators: 100
  test_size: 0.2
  save_report: true
  report_file: reports/adversarial_validation_report.json
