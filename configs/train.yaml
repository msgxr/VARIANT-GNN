# configs/train.yaml — Eğitim modu yapılandırması
# default.yaml değerlerini override eder

mode: train

training:
  cv_folds: 5
  test_size: 0.20
  calibration_size: 0.15
  optimize_weights: true
  save_artifacts: true
  report_panel_metrics: true

preprocessing:
  use_autoencoder: true
  autoencoder_encoding_dim: 16
  autoencoder_epochs: 10
  corr_threshold: 0.25
  smote_enabled: false               # TEKNOFEST §3.2: veri dengeli, SMOTE gereksiz
  use_bio_scoring: true              # BLOSUM62 + Grantham skorları

gnn:
  epochs: 50                         # PSR uyumlu (early stopping koruyucu)
  early_stopping_patience: 20        # PSR §4.5
  use_multimodal: true

dnn:
  epochs: 20

paths:
  output_dir: models/current
  reports_dir: reports
