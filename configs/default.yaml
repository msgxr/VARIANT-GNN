seed: 42
device: auto  # auto | cpu | cuda

paths:
  data_dir: data
  models_dir: models
  reports_dir: reports

gnn:
  hidden_dim: 128
  epochs: 50
  lr: 0.001
  weight_decay: 1.0e-4
  use_gat: true
  knn_k: 10                          # Rapor §3.3: cosine k-NN k=10
  knn_threshold: 0.3                  # Rapor §3.3: cosine similarity eşiği
  early_stopping_patience: 20         # Rapor §3.5/§4.5: patience 15-50 arası
  use_multimodal: true    # Nuc_Context/AA_Context → SequenceEncoder → GNN (TEKNOFEST şartname uyumu)
  seq_enc_dim: 32          # SequenceEncoder output dim (cnn_channels*2)

dnn:
  hidden_dim: 128
  epochs: 20
  lr: 0.001
  weight_decay: 1.0e-4

xgb:
  objective: binary:logistic
  eval_metric: logloss
  max_depth: 6
  learning_rate: 0.05
  subsample: 0.8
  colsample_bytree: 0.8
  n_estimators: 200
  n_jobs: -1
  min_child_weight: 3
  reg_alpha: 0.05
  reg_lambda: 1.0

lgbm:
  num_leaves: 63
  max_depth: -1
  learning_rate: 0.05
  n_estimators: 300
  subsample: 0.8
  colsample_bytree: 0.8
  reg_alpha: 0.1
  reg_lambda: 1.0
  min_child_samples: 10
  n_jobs: -1
  verbose: -1

ensemble:
  weights: [0.30, 0.30, 0.25, 0.15]   # [XGB, LGB, GNN, DNN] — Rapor §5.3
  optimize_weights: true               # Nelder-Mead ile validation-set optimizasyonu

preprocessing:
  corr_threshold: 0.25
  use_autoencoder: true
  autoencoder_encoding_dim: 16
  autoencoder_epochs: 10
  use_feature_selection: true          # Rapor §3.3: VarianceThreshold + SelectKBest (ANOVA)
  k_best_features: 35                  # Rapor §3.3: k=35
  smote_enabled: false                 # TEKNOFEST §3.2: veri zaten dengeli (50/50 P/B), SMOTE gereksiz
  use_bio_scoring: false             # Grantham/BLOSUM zaten girdi öznitelikler arasında (AA_Grantham_Score); duplicate enrichment kapalı

calibration:
  enabled: true
  method: isotonic            # isotonic | sigmoid

training:
  test_size: 0.2
  cv_folds: 5
  batch_size: 32
  loss_function: weighted_bce   # weighted_bce | focal
  focal_gamma: 2.0              # FocalLoss gamma parametresi (sadece loss_function=focal)

thresholds:
  classification: 0.50                # TEKNOFEST 2026 §7.3: Dengeli veri için F1-optimal eşik
  high_risk: 0.7

schema:
  target_column: Label
  id_columns:
    - Variant_ID
  non_feature_columns:
    - Panel
    - Nuc_Context
    - AA_Context
  label_mapping:
    pathogenic: 1
    "likely pathogenic": 1
    benign: 0
    "likely benign": 0
    "1": 1
    "1.0": 1
    "0": 0
    "0.0": 0

# ─── Panel Tanımları (TEKNOFEST 2026 Şartname Bölüm 3.2) ───
panels:
  General:
    train_pathogenic: 1500
    train_benign: 1500
    test_pathogenic: 1000
    test_benign: 1000
  Hereditary_Cancer:
    train_pathogenic: 200
    train_benign: 200
    test_pathogenic: 100
    test_benign: 100
  PAH:
    train_pathogenic: 200
    train_benign: 200
    test_pathogenic: 100
    test_benign: 100
  CFTR:
    train_pathogenic: 70
    train_benign: 70
    test_pathogenic: 30
    test_benign: 30

# ─── External Validation ───
external_validation:
  enabled: true
  metrics:
    - f1
    - roc_auc
    - brier_score
    - precision
    - recall
  export_predictions: true
