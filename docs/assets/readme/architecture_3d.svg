<svg width="1400" height="780" viewBox="0 0 1400 780" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="VARIANT-GNN 3D architecture">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b1020"/>
      <stop offset="55%" stop-color="#0b2c5f"/>
      <stop offset="100%" stop-color="#0b5d7a"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.05"/>
    </linearGradient>
    <linearGradient id="cubeTop" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1e3a8a"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
    <linearGradient id="cubeSide" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1d4ed8"/>
      <stop offset="100%" stop-color="#1e40af"/>
    </linearGradient>
    <linearGradient id="cubeFront" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0ea5e9"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="160%" height="160%">
      <feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#000" flood-opacity="0.45"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#22c55e"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1400" height="780" fill="url(#bg)"/>
  <circle cx="1150" cy="120" r="240" fill="#22c55e" opacity="0.09"/>
  <circle cx="260" cy="690" r="300" fill="#38bdf8" opacity="0.08"/>

  <text x="70" y="90" fill="#e2e8f0" font-family="Segoe UI, Arial, sans-serif" font-size="52" font-weight="700">VARIANT-GNN</text>
  <text x="70" y="130" fill="#93c5fd" font-family="Segoe UI, Arial, sans-serif" font-size="24">3D System View - TEKNOFEST 2026</text>

  <!-- 3D block helper pattern repeated manually -->
  <!-- Block 1 -->
  <g filter="url(#shadow)">
    <polygon points="110,210 360,210 400,185 150,185" fill="url(#cubeTop)"/>
    <polygon points="360,210 400,185 400,335 360,360" fill="url(#cubeSide)"/>
    <rect x="110" y="210" width="250" height="150" fill="url(#cubeFront)"/>
    <rect x="110" y="210" width="250" height="150" fill="url(#glass)"/>
  </g>
  <text x="145" y="270" fill="#f8fafc" font-family="Segoe UI, Arial, sans-serif" font-size="28" font-weight="700">Input Layer</text>
  <text x="145" y="305" fill="#dbeafe" font-family="Segoe UI, Arial, sans-serif" font-size="20">Panel Data + Features</text>

  <!-- Block 2 -->
  <g filter="url(#shadow)">
    <polygon points="455,210 705,210 745,185 495,185" fill="url(#cubeTop)"/>
    <polygon points="705,210 745,185 745,335 705,360" fill="url(#cubeSide)"/>
    <rect x="455" y="210" width="250" height="150" fill="url(#cubeFront)"/>
    <rect x="455" y="210" width="250" height="150" fill="url(#glass)"/>
  </g>
  <text x="485" y="270" fill="#f8fafc" font-family="Segoe UI, Arial, sans-serif" font-size="28" font-weight="700">Preprocess</text>
  <text x="485" y="305" fill="#dbeafe" font-family="Segoe UI, Arial, sans-serif" font-size="20">Impute + Scale + Select</text>

  <!-- Block 3 -->
  <g filter="url(#shadow)">
    <polygon points="800,210 1050,210 1090,185 840,185" fill="url(#cubeTop)"/>
    <polygon points="1050,210 1090,185 1090,335 1050,360" fill="url(#cubeSide)"/>
    <rect x="800" y="210" width="250" height="150" fill="url(#cubeFront)"/>
    <rect x="800" y="210" width="250" height="150" fill="url(#glass)"/>
  </g>
  <text x="850" y="270" fill="#f8fafc" font-family="Segoe UI, Arial, sans-serif" font-size="28" font-weight="700">Model Pool</text>
  <text x="850" y="305" fill="#dbeafe" font-family="Segoe UI, Arial, sans-serif" font-size="20">XGB + LGBM + GNN + DNN</text>

  <!-- Block 4 -->
  <g filter="url(#shadow)">
    <polygon points="280,470 590,470 630,445 320,445" fill="url(#cubeTop)"/>
    <polygon points="590,470 630,445 630,630 590,655" fill="url(#cubeSide)"/>
    <rect x="280" y="470" width="310" height="185" fill="url(#cubeFront)"/>
    <rect x="280" y="470" width="310" height="185" fill="url(#glass)"/>
  </g>
  <text x="325" y="545" fill="#f8fafc" font-family="Segoe UI, Arial, sans-serif" font-size="30" font-weight="700">Stacking + Calibration</text>
  <text x="325" y="585" fill="#dbeafe" font-family="Segoe UI, Arial, sans-serif" font-size="21">Isotonic + Reliability</text>

  <!-- Block 5 -->
  <g filter="url(#shadow)">
    <polygon points="700,470 1010,470 1050,445 740,445" fill="url(#cubeTop)"/>
    <polygon points="1010,470 1050,445 1050,630 1010,655" fill="url(#cubeSide)"/>
    <rect x="700" y="470" width="310" height="185" fill="url(#cubeFront)"/>
    <rect x="700" y="470" width="310" height="185" fill="url(#glass)"/>
  </g>
  <text x="760" y="545" fill="#f8fafc" font-family="Segoe UI, Arial, sans-serif" font-size="30" font-weight="700">Clinical Output</text>
  <text x="760" y="585" fill="#dbeafe" font-family="Segoe UI, Arial, sans-serif" font-size="21">Risk + Confidence + UQ</text>

  <!-- Connectors -->
  <line x1="400" y1="280" x2="455" y2="280" stroke="#22c55e" stroke-width="6" marker-end="url(#arrow)"/>
  <line x1="745" y1="280" x2="800" y2="280" stroke="#22c55e" stroke-width="6" marker-end="url(#arrow)"/>
  <line x1="950" y1="360" x2="950" y2="430" stroke="#22c55e" stroke-width="6" marker-end="url(#arrow)"/>
  <line x1="800" y1="562" x2="630" y2="562" stroke="#22c55e" stroke-width="6" marker-end="url(#arrow)"/>

  <text x="70" y="740" fill="#cbd5e1" font-family="Segoe UI, Arial, sans-serif" font-size="19">Layered architecture visualization generated for README showcase.</text>
</svg>
