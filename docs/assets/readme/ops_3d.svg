<svg width="1400" height="660" viewBox="0 0 1400 660" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="VARIANT-GNN operations 3D">
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#06111f"/>
      <stop offset="100%" stop-color="#0c3b3f"/>
    </linearGradient>
    <linearGradient id="node" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <filter id="glow">
      <feDropShadow dx="0" dy="0" stdDeviation="8" flood-color="#22d3ee" flood-opacity="0.45"/>
    </filter>
    <marker id="arr2" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#22d3ee"/>
    </marker>
  </defs>

  <rect width="1400" height="660" fill="url(#bg2)"/>
  <text x="60" y="70" fill="#f1f5f9" font-size="48" font-family="Segoe UI, Arial, sans-serif" font-weight="700">Operational 3D Pipeline</text>
  <text x="60" y="106" fill="#7dd3fc" font-size="22" font-family="Segoe UI, Arial, sans-serif">Data - Training - Validation - Explainability - Delivery</text>

  <g filter="url(#glow)">
    <rect x="80" y="190" rx="18" ry="18" width="220" height="120" fill="url(#node)"/>
    <rect x="340" y="190" rx="18" ry="18" width="220" height="120" fill="url(#node)"/>
    <rect x="600" y="190" rx="18" ry="18" width="220" height="120" fill="url(#node)"/>
    <rect x="860" y="190" rx="18" ry="18" width="220" height="120" fill="url(#node)"/>
    <rect x="1120" y="190" rx="18" ry="18" width="220" height="120" fill="url(#node)"/>
  </g>

  <text x="125" y="248" fill="#ffffff" font-size="28" font-family="Segoe UI, Arial, sans-serif" font-weight="700">Data</text>
  <text x="378" y="248" fill="#ffffff" font-size="28" font-family="Segoe UI, Arial, sans-serif" font-weight="700">Train</text>
  <text x="620" y="248" fill="#ffffff" font-size="28" font-family="Segoe UI, Arial, sans-serif" font-weight="700">Validate</text>
  <text x="882" y="248" fill="#ffffff" font-size="28" font-family="Segoe UI, Arial, sans-serif" font-weight="700">Explain</text>
  <text x="1148" y="248" fill="#ffffff" font-size="28" font-family="Segoe UI, Arial, sans-serif" font-weight="700">Deliver</text>

  <line x1="300" y1="250" x2="340" y2="250" stroke="#22d3ee" stroke-width="6" marker-end="url(#arr2)"/>
  <line x1="560" y1="250" x2="600" y2="250" stroke="#22d3ee" stroke-width="6" marker-end="url(#arr2)"/>
  <line x1="820" y1="250" x2="860" y2="250" stroke="#22d3ee" stroke-width="6" marker-end="url(#arr2)"/>
  <line x1="1080" y1="250" x2="1120" y2="250" stroke="#22d3ee" stroke-width="6" marker-end="url(#arr2)"/>

  <rect x="80" y="390" rx="20" ry="20" width="1260" height="190" fill="#0b1f2b" opacity="0.86"/>
  <text x="120" y="448" fill="#e2e8f0" font-size="28" font-family="Segoe UI, Arial, sans-serif" font-weight="700">Highlights</text>
  <text x="120" y="492" fill="#bae6fd" font-size="22" font-family="Segoe UI, Arial, sans-serif">- Stratified 5-fold CV + panel-based reporting</text>
  <text x="120" y="528" fill="#bae6fd" font-size="22" font-family="Segoe UI, Arial, sans-serif">- Isotonic calibration + MC Dropout uncertainty</text>
  <text x="120" y="564" fill="#bae6fd" font-size="22" font-family="Segoe UI, Arial, sans-serif">- SHAP / LIME / GNNExplainer + Turkish clinical summaries</text>
</svg>
