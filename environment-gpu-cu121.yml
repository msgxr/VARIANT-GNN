# ─────────────────────────────────────────────────────────────────────────────
# VARIANT-GNN  |  GPU Environment — CUDA 12.1
# TEKNOFEST 2026 — Genetik Varyant Patojenite Sınıflandırma
#
# Kullanım:
#   conda env create -f environment-gpu-cu121.yml
#   conda activate variant-gnn-gpu121
#
# Gereksinim: NVIDIA GPU + CUDA 12.1 uyumlu sürücü (≥ 530.xx)
# Platform  : Linux x86_64 (önerilen) / Windows (WSL2 ile)
# Python    : 3.11
# PyTorch   : 2.2.1+cu121
# cuDNN     : 8.9.x
#
# Hangi CUDA versiyonu uygun?
#   nvidia-smi → sağ üst köşedeki CUDA Version
#   12.x → bu dosyayı kullan
#   11.8  → environment-gpu-cu118.yml kullan
# ─────────────────────────────────────────────────────────────────────────────

name: variant-gnn-gpu121

channels:
  - pytorch
  - nvidia
  - conda-forge
  - defaults

dependencies:
  # ── Runtime ────────────────────────────────────────────────────────────────
  - python=3.11.9
  - pip>=24.0

  # ── CUDA Araç Takımı ───────────────────────────────────────────────────────
  - nvidia::cuda-toolkit=12.1.0
  - nvidia::cudnn=8.9.7.29

  # ── Sistem & Sayısal Temel ─────────────────────────────────────────────────
  - numpy=1.26.4
  - scipy=1.13.0
  - pandas=2.2.2
  - pyarrow>=15.0

  # ── ML ─────────────────────────────────────────────────────────────────────
  - scikit-learn=1.4.2
  - xgboost=2.0.3
  - lightgbm=4.3.0
  - imbalanced-learn=0.12.3
  - optuna=3.6.1

  # ── PyTorch (CUDA 12.1) ────────────────────────────────────────────────────
  - pytorch::pytorch=2.2.1=py3.11_cuda12.1_cudnn8.9.2_0
  - pytorch::torchvision=0.17.1=py311_cu121

  # ── Görselleştirme ─────────────────────────────────────────────────────────
  - matplotlib=3.8.4
  - seaborn=0.13.2
  - networkx=3.3

  # ── Uygulama ───────────────────────────────────────────────────────────────
  - pyyaml=6.0.1
  - pydantic=2.7.1
  - tqdm=4.66.4
  - joblib=1.4.2

  # ── Geliştirme & Test ──────────────────────────────────────────────────────
  - pytest=8.2.0
  - pytest-cov=5.0.0
  - pytest-xdist=3.5.0
  - pytest-timeout=2.3.1
  - ruff=0.4.4
  - mypy=1.10.0
  - ipykernel=6.29.4
  - ipython=8.24.0

  # ── pip ile kurulacaklar ───────────────────────────────────────────────────
  - pip:
    # PyTorch Geometric — CUDA 12.1 wheels
    - torch-scatter==2.1.2  --find-links https://data.pyg.org/whl/torch-2.2.1+cu121.html
    - torch-sparse==0.6.18  --find-links https://data.pyg.org/whl/torch-2.2.1+cu121.html
    - torch-cluster==1.6.3  --find-links https://data.pyg.org/whl/torch-2.2.1+cu121.html
    - torch-geometric==2.5.3

    # Explainability
    - shap==0.45.1
    - lime==0.2.0.1

    # Biyoinformatik / Yarışma özel
    - vcfpy==0.13.8
    - fpdf2==2.7.9

    # MLOps
    - mlflow==2.13.0

    # Streamlit UI
    - streamlit==1.35.0
    - stmol==0.0.9
    - py3Dmol==2.1.0

    # API
    - fastapi==0.111.0
    - uvicorn[standard]==0.29.0
    - python-multipart==0.0.9

    # Type stubs & güvenlik
    - types-PyYAML
    - pip-audit>=2.7.0

    # Proje kendisi
    - -e .
