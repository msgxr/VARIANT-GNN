[metadata]
name = variant-gnn
version = 2.0.0
description = GNN-powered genetic variant pathogenicity prediction
author = XYRA3 Team
license = MIT

[options]
packages = find:
python_requires = >=3.9

[tool:pytest]
testpaths = tests
addopts = -q --tb=short

[mypy]
python_version = 3.9
warn_return_any = True
warn_unused_configs = True
ignore_missing_imports = True
