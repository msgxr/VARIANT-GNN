# ─────────────────────────────────────────────────────────────────────────────
# VARIANT-GNN  |  CI Environment (minimal, hızlı kurulum)
# TEKNOFEST 2026
#
# Bu dosya yalnızca GitHub Actions CI içindir.
# PyTorch CPU wheels ayrı adımda kurulur (cache optimizasyonu için).
#
# Kullanım (lokal CI simülasyonu):
#   conda env create -f environment-ci.yml
#   conda activate variant-gnn-ci
# ─────────────────────────────────────────────────────────────────────────────

name: variant-gnn-ci

channels:
  - conda-forge
  - defaults

dependencies:
  - python=3.11.9
  - pip>=24.0

  # Sayısal temel
  - numpy=1.26.4
  - scipy=1.13.0
  - pandas=2.2.2

  # ML (PyTorch hariç)
  - scikit-learn=1.4.2
  - xgboost=2.0.3
  - lightgbm=4.3.0
  - imbalanced-learn=0.12.3
  - joblib=1.4.2

  # Uygulama
  - pyyaml=6.0.1
  - pydantic=2.7.1

  # Test
  - pytest=8.2.0
  - pytest-cov=5.0.0
  - pytest-timeout=2.3.1

  # Kod kalitesi
  - ruff=0.4.4
  - mypy=1.10.0

  # pip bağımlılıkları
  - pip:
    - bandit[toml]==1.7.9
    - pip-audit>=2.7.0
    - types-PyYAML
    - shap==0.45.1
