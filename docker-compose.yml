version: '3.8'

# ─────────────────────────────────────────────────────────────────────────────
# VARIANT-GNN — Konteyner Mimarisi
# TEKNOFEST 2026 | Takım XYRA3
#
# Servisler:
#   variant-gnn-ui   → Streamlit Dashboard   (port 8501)
#   variant-gnn-api  → FastAPI REST Endpoint (port 8000)
#
# Kullanım:
#   docker-compose up                  # Her iki servisi başlat
#   docker-compose up variant-gnn-api  # Sadece API
#   docker-compose up variant-gnn-ui   # Sadece UI
# ─────────────────────────────────────────────────────────────────────────────

services:

  # ── Streamlit Dashboard ────────────────────────────────────────────────────
  variant-gnn-ui:
    build:
      context: .
      dockerfile: Dockerfile
    image: variant-gnn:latest
    container_name: variant_gnn_ui
    ports:
      - "8501:8501"
    volumes:
      - ./models:/app/models:ro    # Model artifact'leri (read-only)
      - ./data:/app/data:ro
      - ./reports:/app/reports
    environment:
      - STREAMLIT_SERVER_PORT=8501
      - STREAMLIT_SERVER_ADDRESS=0.0.0.0
      - PYTHONPATH=/app
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8501/_stcore/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # ── FastAPI REST API ───────────────────────────────────────────────────────
  variant-gnn-api:
    build:
      context: .
      dockerfile: Dockerfile.api
    image: variant-gnn-api:latest
    container_name: variant_gnn_api
    ports:
      - "8000:8000"
    volumes:
      - ./models:/app/models:ro
      - ./data:/app/data:ro
      - ./reports:/app/reports
    environment:
      - PYTHONPATH=/app
      - UVICORN_WORKERS=2
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s

# ─────────────────────────────────────────────────────────────────────────────
# Shared named volumes (gelecek: PostgreSQL / Redis entegrasyonu için)
# ─────────────────────────────────────────────────────────────────────────────
volumes:
  models:
  reports:
