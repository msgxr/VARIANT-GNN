version: 2
updates:
  # GitHub Actions sürümlerini güncel tut
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "ci"
    labels:
      - "dependencies"
      - "ci"

  # Python bağımlılıklarını güncel tut
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "deps"
    labels:
      - "dependencies"
    ignore:
      # Major version bumps manuel yapılır
      - dependency-name: "torch"
        update-types: ["version-update:semver-major"]
      - dependency-name: "torch-geometric"
        update-types: ["version-update:semver-major"]
      - dependency-name: "xgboost"
        update-types: ["version-update:semver-major"]
