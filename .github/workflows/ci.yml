name: CI

on:
  push:
    branches: ["main", "develop"]
  pull_request:
    branches: ["main"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONPATH: ${{ github.workspace }}
  PYTHONDONTWRITEBYTECODE: "1"
  PYTHONUNBUFFERED: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  TORCH_VERSION: "2.2.0"
  TORCH_INDEX: "https://download.pytorch.org/whl/cpu"
  PYG_INDEX: "https://data.pyg.org/whl/torch-2.2.0+cpu.html"

# ─────────────────────────────────────────────────────────────────────────────
# JOB DEPENDENCY GRAPH
#
#  lint ──┬──► type-check ──┐
#          └──► security    ├──► test (matrix) ──► competition-compliance
#                           │                  └──► coverage-report
#                           └──► dependency-audit
#
# ─────────────────────────────────────────────────────────────────────────────

jobs:

  # ───────────────────────────────────────────────────────────────────────────
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install ruff
        run: pip install "ruff>=0.3.0"

      - name: ruff check
        run: |
          ruff check src/ tests/ scripts/ submission/ main.py \
            --output-format=github \
            --exit-non-zero-on-fix

      - name: ruff format check
        run: ruff format --check src/ tests/ scripts/ submission/ main.py

  # ───────────────────────────────────────────────────────────────────────────
  type-check:
    name: Type Check (mypy)
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Restore pip cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-typecheck-${{ hashFiles('requirements-ci.txt') }}
          restore-keys: pip-typecheck-

      - name: Install CPU torch + PyG
        run: |
          pip install torch==${{ env.TORCH_VERSION }}+cpu \
            --index-url ${{ env.TORCH_INDEX }}
          pip install torch-scatter torch-sparse torch-geometric \
            -f ${{ env.PYG_INDEX }}

      - name: Install CI dependencies
        run: pip install -r requirements-ci.txt

      - name: mypy — core src
        run: |
          mypy src/data/ src/ensemble/ src/inference/ src/evaluation/ src/utils/ \
            --ignore-missing-imports \
            --no-error-summary \
            --pretty

  # ───────────────────────────────────────────────────────────────────────────
  security:
    name: Security (bandit + pip-audit)
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install scanners
        run: pip install "bandit[toml]>=1.7.0" pip-audit

      - name: bandit — source code
        run: |
          bandit -r src/ scripts/ submission/ main.py \
            --severity-level medium \
            --confidence-level medium \
            --skip B101,B301,B403,B614 \
            --format txt \
            --exit-zero

      - name: bandit — strict on new competition modules
        run: |
          bandit -r src/data/leakage_firewall.py \
                    src/data/competition_sanitizer.py \
                    src/inference/external_validation_runner.py \
                    src/inference/triage.py \
                    submission/predict.py \
            --severity-level low \
            --confidence-level high \
            --skip B101,B301,B403,B614

      - name: pip-audit — dependency CVE check
        run: |
          pip install -r requirements-ci.txt --quiet
          pip-audit --skip-editable --ignore-vuln PYSEC-2022-42974 \
            || echo "::warning::pip-audit found issues — review before release"

  # ───────────────────────────────────────────────────────────────────────────
  dependency-audit:
    name: Dependency Audit
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Check requirements consistency
        run: |
          pip install pip-tools --quiet
          # requirements-ci.txt içindeki paketlerin birbirine uyumluluğunu doğrula
          pip install -r requirements-ci.txt --dry-run --quiet \
            && echo "Requirements consistent" \
            || echo "::warning::Dependency conflict detected"

      - name: Pin drift detection
        run: |
          python - <<'EOF'
          import subprocess, sys
          result = subprocess.run(
              ["pip", "install", "--dry-run", "-r", "requirements-ci.txt"],
              capture_output=True, text=True
          )
          if "conflict" in result.stderr.lower():
              print("::error::Dependency conflict in requirements-ci.txt")
              sys.exit(1)
          print("No conflicts detected.")
          EOF

  # ───────────────────────────────────────────────────────────────────────────
  test:
    name: Tests · Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    needs: [type-check, security]
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      # ── Torch wheels cache (heavy, ~1 GB) ──────────────────────────────
      - name: Cache torch wheels
        uses: actions/cache@v4
        id: torch-cache
        with:
          path: ~/.cache/pip/wheels
          key: torch-cpu-${{ matrix.python-version }}-${{ env.TORCH_VERSION }}
          restore-keys: torch-cpu-${{ matrix.python-version }}-

      - name: Install CPU-only PyTorch
        run: |
          pip install torch==${{ env.TORCH_VERSION }}+cpu \
            --index-url ${{ env.TORCH_INDEX }}

      - name: Install torch-geometric CPU wheels
        run: |
          pip install torch-scatter torch-sparse torch-geometric \
            -f ${{ env.PYG_INDEX }}

      - name: Install CI dependencies
        run: |
          pip install "numpy>=1.24.0,<2.0"
          pip install -r requirements-ci.txt

      # ── Smoke tests ───────────────────────────────────────────────────
      - name: Smoke tests
        run: |
          pytest tests/smoke/ \
            --tb=short -q \
            --junitxml=reports/junit-smoke-${{ matrix.python-version }}.xml

      # ── Unit tests ────────────────────────────────────────────────────
      - name: Unit tests
        run: |
          pytest tests/unit/ \
            --tb=short -q \
            --cov=src \
            --cov-report=xml:reports/coverage-unit-${{ matrix.python-version }}.xml \
            --cov-report=term-missing \
            --junitxml=reports/junit-unit-${{ matrix.python-version }}.xml

      # ── Integration tests ─────────────────────────────────────────────
      - name: Integration tests
        run: |
          pytest tests/integration/ \
            --tb=short -q \
            --cov=src \
            --cov-append \
            --cov-report=xml:reports/coverage-integration-${{ matrix.python-version }}.xml \
            --junitxml=reports/junit-integration-${{ matrix.python-version }}.xml

      # ── Upload test artifacts ─────────────────────────────────────────
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-py${{ matrix.python-version }}
          path: reports/
          retention-days: 14

      # ── GitHub step summary ───────────────────────────────────────────
      - name: Write test summary
        if: always()
        run: |
          python - <<'EOF'
          import xml.etree.ElementTree as ET, pathlib, os

          summary = ["## Test Results — Python ${{ matrix.python-version }}\n", "| Suite | Tests | Passed | Failed | Errors |", "|-|-|-|-|-|"]
          for xml_path in sorted(pathlib.Path("reports").glob("junit-*.xml")):
              try:
                  root = ET.parse(xml_path).getroot()
                  suite = xml_path.stem.replace("junit-", "").replace("-${{ matrix.python-version }}", "")
                  tests   = root.attrib.get("tests", "?")
                  failed  = root.attrib.get("failures", "0")
                  errors  = root.attrib.get("errors", "0")
                  passed  = str(int(tests) - int(failed) - int(errors)) if tests.isdigit() else "?"
                  icon    = "✅" if failed == "0" and errors == "0" else "❌"
                  summary.append(f"| {icon} {suite} | {tests} | {passed} | {failed} | {errors} |")
              except Exception:
                  pass
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as fh:
              fh.write("\n".join(summary) + "\n")
          EOF

  # ───────────────────────────────────────────────────────────────────────────
  coverage-report:
    name: Coverage Gate (≥ 70%)
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Download test reports (py3.11)
        uses: actions/download-artifact@v4
        with:
          name: test-reports-py3.11
          path: reports/

      - name: Install coverage
        run: pip install coverage

      - name: Coverage gate
        run: |
          # Birleştirilmiş coverage XML'den toplam satır yüzdesini hesapla
          python - <<'EOF'
          import xml.etree.ElementTree as ET, pathlib, sys

          total_lines, covered_lines = 0, 0
          for xml_path in pathlib.Path("reports").glob("coverage-*.xml"):
              try:
                  root = ET.parse(xml_path).getroot()
                  for pkg in root.iter("package"):
                      total_lines   += int(pkg.attrib.get("lines-valid", 0))
                      covered_lines += int(pkg.attrib.get("lines-covered", 0))
              except Exception:
                  pass

          if total_lines == 0:
              print("::warning::No coverage data found — skipping gate.")
              sys.exit(0)

          pct = covered_lines / total_lines * 100
          print(f"Coverage: {pct:.1f}% ({covered_lines}/{total_lines} lines)")

          THRESHOLD = 70.0
          if pct < THRESHOLD:
              print(f"::error::Coverage {pct:.1f}% is below threshold {THRESHOLD}%")
              sys.exit(1)
          print(f"✅ Coverage gate passed ({pct:.1f}% ≥ {THRESHOLD}%)")
          EOF

  # ───────────────────────────────────────────────────────────────────────────
  competition-compliance:
    name: Competition Compliance (TEKNOFEST §3.2 / §7.3)
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Cache torch wheels
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip/wheels
          key: torch-cpu-3.11-${{ env.TORCH_VERSION }}

      - name: Install dependencies
        run: |
          pip install torch==${{ env.TORCH_VERSION }}+cpu \
            --index-url ${{ env.TORCH_INDEX }}
          pip install torch-scatter torch-sparse torch-geometric \
            -f ${{ env.PYG_INDEX }}
          pip install "numpy>=1.24.0,<2.0" -r requirements-ci.txt

      # ── 1. Leakage Firewall — koordinat + label kolon engeli ──────────
      - name: Leakage Firewall — prohibited column detection
        run: |
          python - <<'EOF'
          import pandas as pd, sys, tempfile, pathlib
          from src.data.leakage_firewall import LeakageFirewall, COORDINATE_COLUMNS, LABEL_COLUMNS

          # Her yasaklı koordinat kolonunun tespit edildiğini doğrula
          for banned in list(COORDINATE_COLUMNS)[:5]:
              df = pd.DataFrame({"Variant_ID": ["V1"], banned: ["chr1"], "SIFT_score": [0.5]})
              fw = LeakageFirewall(competition_mode=True, reports_dir=pathlib.Path("/tmp"))
              _, report = fw.check_and_sanitize(df)
              assert banned in report.coordinate_hits or banned.lower() in [c.lower() for c in report.coordinate_hits], \
                  f"FAIL: '{banned}' not detected"

          # Label kolonunun inference'da engellenmesi
          df = pd.DataFrame({"Variant_ID": ["V1"], "label": [1], "SIFT_score": [0.5]})
          fw = LeakageFirewall(competition_mode=True, reports_dir=pathlib.Path("/tmp"))
          _, report = fw.check_and_sanitize(df, is_inference=True)
          assert "label" in report.label_hits, "FAIL: 'label' not blocked in inference"

          print("✅ Leakage Firewall: all prohibited columns correctly detected.")
          EOF

      # ── 2. Prediction Schema — 10 sabit çıktı kolonu ─────────────────
      - name: Prediction Schema — output column contract
        run: |
          python - <<'EOF'
          import numpy as np, pandas as pd
          from src.inference.prediction_schema import (
              PREDICTION_COLUMNS, build_prediction_frame, validate_prediction_frame
          )

          assert len(PREDICTION_COLUMNS) == 12, f"Expected 12 columns (10 standart + OOD_Score/OOD_Flag), got {len(PREDICTION_COLUMNS)}"

          n = 50
          rng = np.random.default_rng(42)
          df = build_prediction_frame(
              variant_ids=pd.Series([f"V{i}" for i in range(n)]),
              panels=pd.Series(["General"] * n),
              pathogenic_prob=rng.uniform(0, 1, n),
              calibrated_risk=rng.uniform(0, 1, n),
              uncertainty=rng.uniform(0, 0.5, n),
              clinical_flags=np.array(["STABLE_PREDICTION"] * n),
              threshold=0.5,
              model_version="ci-test",
          )
          validate_prediction_frame(df)
          assert list(df.columns) == PREDICTION_COLUMNS, "Column order mismatch"
          assert set(df["Prediction"].unique()).issubset({"Pathogenic", "Benign"})
          assert (df["Pathogenic_Probability"] >= 0).all() and (df["Pathogenic_Probability"] <= 1).all()
          print(f"✅ Prediction Schema: {len(PREDICTION_COLUMNS)} columns, {n} rows validated.")
          EOF

      # ── 3. Triage Engine — binary Prediction değişmez ─────────────────
      - name: Triage Engine — prediction immutability
        run: |
          python - <<'EOF'
          import numpy as np
          from src.inference.triage import TriageEngine, ALL_FLAGS

          rng = np.random.default_rng(42)
          p = rng.uniform(0, 1, 200)
          u = rng.uniform(0, 0.6, 200)
          eng = TriageEngine()
          flags = eng.assign_flags(p, u, threshold=0.5)

          assert flags.shape == (200,), "Shape mismatch"
          assert all(f in ALL_FLAGS for f in flags), "Unknown flag produced"

          # Binary prediction threshold logic must hold independently of flags
          binary = (p >= 0.5).astype(int)
          assert binary[p > 0.8].sum() == (p > 0.8).sum(), "Binary logic broken"
          print(f"✅ Triage Engine: {len(ALL_FLAGS)} flags, 200 samples, Prediction immutable.")
          EOF

      # ── 4. Panel-Aware Ensemble — weights sum to 1, non-negative ──────
      - name: Panel-Aware Ensemble — weight contract
        run: |
          python - <<'EOF'
          import numpy as np
          from src.ensemble.panel_aware_ensemble import PanelAwareEnsemble, KNOWN_PANELS

          rng = np.random.default_rng(42)
          n, n_models = 300, 4
          preds = rng.uniform(0, 1, (n, n_models))
          y = rng.integers(0, 2, n)
          panels = [KNOWN_PANELS[i % len(KNOWN_PANELS)] for i in range(n)]

          ens = PanelAwareEnsemble(n_models=n_models, seed=42).fit(preds, y, panels)

          assert abs(ens._global_weights.sum() - 1.0) < 1e-6, "Global weights don't sum to 1"
          assert (ens._global_weights >= 0).all(), "Negative global weights"

          for panel, w in ens._panel_weights.items():
              assert abs(w.sum() - 1.0) < 1e-6, f"Panel '{panel}' weights don't sum to 1"
              assert (w >= 0).all(), f"Negative weights for panel '{panel}'"

          # Blind/test verisi kullanılmamalı — sadece OOF üzerinden
          out = ens.predict_proba(preds[:10], panels[:10])
          assert (out >= 0).all() and (out <= 1).all()
          print(f"✅ Panel-Aware Ensemble: weights ∈ [0,1], sum=1 for {len(ens._panel_weights)} panels.")
          EOF

      # ── 5. Reproducibility — aynı seed → aynı sonuç ──────────────────
      - name: Reproducibility — deterministic output
        run: |
          python - <<'EOF'
          import numpy as np
          from src.utils.reproducibility import setup_reproducibility

          setup_reproducibility(seed=42)
          a = np.random.rand(10)
          setup_reproducibility(seed=42)
          b = np.random.rand(10)
          assert np.array_equal(a, b), "Non-deterministic output with same seed"
          print("✅ Reproducibility: seed=42 yields identical outputs across runs.")
          EOF

      # ── 6. submission/predict.py — import ve argparse sağlığı ─────────
      - name: submission/predict.py — import check
        run: |
          python -c "
          import importlib.util, sys
          spec = importlib.util.spec_from_file_location('predict', 'submission/predict.py')
          mod  = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(mod)
          assert hasattr(mod, 'main'), 'main() function missing'
          print('✅ submission/predict.py: importable, main() present.')
          "

      # ── 7. configs/pdr.yaml — zorunlu anahtarlar ──────────────────────
      - name: PDR config — required keys present
        run: |
          python - <<'EOF'
          import yaml, sys

          with open("configs/pdr.yaml") as fh:
              cfg = yaml.safe_load(fh)

          REQUIRED = {
              "competition": ["mode", "strict_leakage"],
              "ensemble":    ["panel_aware"],
              "triage":      ["enabled", "uncertainty_threshold", "borderline_margin", "entropy_threshold"],
              "reproducibility": ["seed", "deterministic_torch", "save_manifest"],
          }
          errors = []
          for section, keys in REQUIRED.items():
              if section not in cfg:
                  errors.append(f"Missing section: {section}")
                  continue
              for k in keys:
                  if k not in cfg[section]:
                      errors.append(f"Missing key: {section}.{k}")

          if errors:
              for e in errors:
                  print(f"::error::{e}")
              sys.exit(1)

          assert cfg["competition"]["mode"] is True, "competition.mode must be true"
          assert cfg["reproducibility"]["seed"] == 42, "seed must be 42"
          print("✅ PDR config: all required keys present and valid.")
          EOF

      # ── 8. Şartname §7.3 — F1 metrik kullanımı ────────────────────────
      - name: Competition metric — F1 score contract
        run: |
          python - <<'EOF'
          from sklearn.metrics import f1_score
          import numpy as np

          # §7.3: temel metrik binary F1 (TP, FP, FN üzerinden)
          y_true = np.array([1, 0, 1, 1, 0, 0, 1, 0])
          y_pred = np.array([1, 0, 1, 0, 0, 1, 1, 0])
          f1 = f1_score(y_true, y_pred, average="binary", pos_label=1, zero_division=0)
          assert 0 <= f1 <= 1, "F1 out of range"
          print(f"✅ Competition metric §7.3: binary F1 = {f1:.4f}")
          EOF

      # ── 9. Results consistency gate — tüm beyan edilen metrikler ↔ canonical ──
      # Hiçbir doküman/rapor RESULTS_CANONICAL.json'dan kaymamalı; geri çekilmiş
      # sızıntı sayıları jüri-görünür belgelerde yaşamamalı. Non-zero exit → CI fail.
      - name: Results consistency gate (RESULTS_CANONICAL.json SSOT)
        run: |
          python scripts/check_results_consistency.py

      # ── Compliance summary ────────────────────────────────────────────
      - name: Write compliance summary
        run: |
          cat >> $GITHUB_STEP_SUMMARY << 'EOF'
          ## TEKNOFEST 2026 Competition Compliance ✅

          | Check | Result |
          |---|---|
          | §3.2 Leakage Firewall | ✅ Coordinate + label columns blocked |
          | §7.3 Prediction Schema | ✅ 10-column fixed output |
          | §7.3 Triage Engine | ✅ Binary Prediction immutable |
          | §3.2 Panel-Aware Ensemble | ✅ OOF-only, weights ∈ [0,1] |
          | Reproducibility | ✅ Deterministic seed=42 |
          | submission/predict.py | ✅ Importable, offline-ready |
          | configs/pdr.yaml | ✅ All required keys present |
          | Metric §7.3 | ✅ Binary F1 (TP/FP/FN) |
          | Results consistency | ✅ All declared numbers == RESULTS_CANONICAL.json |
          EOF

  # ───────────────────────────────────────────────────────────────────────────
  leakage-audit:
    name: Leakage Audit (synthetic dataset)
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install minimal deps
        run: |
          pip install "numpy>=1.24.0,<2.0" pandas pyyaml -r requirements-ci.txt \
            --quiet

      - name: Generate synthetic dataset with leakage columns
        run: |
          python - <<'EOF'
          import pandas as pd, numpy as np, pathlib

          rng = np.random.default_rng(0)
          n = 500
          df = pd.DataFrame({
              "Variant_ID":  [f"V{i}" for i in range(n)],
              "Panel":       np.random.choice(["General","Hereditary_Cancer","PAH","CFTR"], n),
              # Legitimate features
              "SIFT_score":              rng.uniform(0, 1, n),
              "CADD_phred":              rng.uniform(0, 40, n),
              "REVEL_score":             rng.uniform(0, 1, n),
              "gnomAD_exomes_AF":        rng.uniform(0, 0.05, n),
              # Injected leakage columns (must be dropped)
              "chromosome":              np.random.choice(["chr1","chr2","chrX"], n),
              "position":                rng.integers(1, 250_000_000, n),
              "rsid":                    [f"rs{i}" for i in range(n)],
              "label":                   rng.integers(0, 2, n),
              "ground_truth":            rng.integers(0, 2, n),
          })
          pathlib.Path("reports").mkdir(exist_ok=True)
          df.to_csv("reports/synthetic_leaky.csv", index=False)
          print(f"Generated synthetic dataset: {df.shape}, columns={list(df.columns)}")
          EOF

      - name: Run leakage audit on synthetic dataset
        run: |
          python - <<'EOF'
          import pandas as pd, json, pathlib, sys
          from src.data.competition_sanitizer import CompetitionSanitizer

          df = pd.read_csv("reports/synthetic_leaky.csv")
          san = CompetitionSanitizer(
              competition_mode=True,
              strict_leakage=False,
              reports_dir=pathlib.Path("reports"),
          )
          clean_train, report_train = san.sanitize_train(df)
          clean_infer, report_infer = san.sanitize_inference(df)

          print("=== TRAIN sanitization ===")
          print(json.dumps(report_train.to_dict(), indent=2))
          print("=== INFERENCE sanitization ===")
          print(json.dumps(report_infer.to_dict(), indent=2))

          # Koordinat kolonları her iki modda da drop edilmeli
          for col in ("chromosome", "position", "rsid"):
              assert col not in clean_train.columns, f"FAIL: '{col}' not removed from train"
              assert col not in clean_infer.columns, f"FAIL: '{col}' not removed from inference"

          # Label kolonları sadece inference'da drop edilmeli
          for col in ("label", "ground_truth"):
              assert col not in clean_infer.columns, f"FAIL: '{col}' not removed from inference"

          print("✅ Leakage audit: all prohibited columns successfully removed.")
          EOF

      - name: Upload leakage audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: leakage-audit-reports
          path: reports/leakage_report*.json
          retention-days: 30

  # ───────────────────────────────────────────────────────────────────────────
  schema-drift:
    name: Schema Drift Detection
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install deps
        run: pip install pandas "numpy>=1.24.0,<2.0" --quiet

      - name: Check PREDICTION_COLUMNS hasn't drifted
        run: |
          python - <<'EOF'
          # Bu liste şartname §7.3 kapsamında sabitlenmiştir.
          # CI burada beklenmedik değişikliği yakalar.
          EXPECTED = [
              "Variant_ID", "Panel", "Prediction",
              "Pathogenic_Probability", "Benign_Probability",
              "Calibrated_Risk", "Uncertainty", "Clinical_Flag",
              "Model_Version", "Inference_Timestamp",
              "OOD_Score", "OOD_Flag",
          ]
          import sys
          sys.path.insert(0, ".")
          from src.inference.prediction_schema import PREDICTION_COLUMNS

          if PREDICTION_COLUMNS != EXPECTED:
              print("::error::PREDICTION_COLUMNS has drifted from the expected schema!")
              print(f"Expected: {EXPECTED}")
              print(f"Got:      {PREDICTION_COLUMNS}")
              sys.exit(1)
          print(f"✅ Schema stable: {PREDICTION_COLUMNS}")
          EOF

      - name: Check COORDINATE_COLUMNS blocklist integrity
        run: |
          python - <<'EOF'
          import sys
          sys.path.insert(0, ".")
          from src.data.leakage_firewall import COORDINATE_COLUMNS, LABEL_COLUMNS

          MUST_CONTAIN_COORD = {"chromosome", "chrom", "chr", "position", "pos",
                                 "rsid", "hgvs_genomic"}
          MUST_CONTAIN_LABEL = {"label", "target", "ground_truth", "y"}

          missing_coord = MUST_CONTAIN_COORD - COORDINATE_COLUMNS
          missing_label = MUST_CONTAIN_LABEL - LABEL_COLUMNS

          if missing_coord:
              print(f"::error::Missing from COORDINATE_COLUMNS: {missing_coord}")
              sys.exit(1)
          if missing_label:
              print(f"::error::Missing from LABEL_COLUMNS: {missing_label}")
              sys.exit(1)
          print(f"✅ Blocklists intact: {len(COORDINATE_COLUMNS)} coord, {len(LABEL_COLUMNS)} label columns.")
          EOF

  # ───────────────────────────────────────────────────────────────────────────
  ci-green:
    name: CI Green Gate
    runs-on: ubuntu-latest
    needs:
      - lint
      - type-check
      - security
      - dependency-audit
      - test
      - coverage-report
      - competition-compliance
      - leakage-audit
      - schema-drift
    if: always()
    steps:
      - name: Check all jobs passed
        run: |
          python - <<'EOF'
          import sys
          results = {
              "lint":                   "${{ needs.lint.result }}",
              "type-check":             "${{ needs.type-check.result }}",
              "security":               "${{ needs.security.result }}",
              "dependency-audit":       "${{ needs.dependency-audit.result }}",
              "test":                   "${{ needs.test.result }}",
              "coverage-report":        "${{ needs.coverage-report.result }}",
              "competition-compliance": "${{ needs.competition-compliance.result }}",
              "leakage-audit":          "${{ needs.leakage-audit.result }}",
              "schema-drift":           "${{ needs.schema-drift.result }}",
          }
          failed = [name for name, res in results.items() if res not in ("success", "skipped")]
          if failed:
              print(f"::error::CI FAILED — jobs: {failed}")
              sys.exit(1)
          print("✅ All CI jobs passed — branch is competition-ready.")
          EOF

      - name: Write final summary
        run: |
          cat >> $GITHUB_STEP_SUMMARY << 'EOF'
          ## CI Green Gate ✅

          All jobs passed. Branch is competition-ready for TEKNOFEST 2026.

          | Category | Jobs |
          |---|---|
          | Code Quality | lint, type-check |
          | Security | security, dependency-audit |
          | Tests | smoke, unit, integration (py3.10 + py3.11) |
          | Coverage | ≥ 70% gate |
          | Competition | compliance, leakage-audit, schema-drift |
          EOF
